name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest version pyproject.toml allows, and the one PRAMAAN is developed on.
        python-version: ["3.10", "3.13"]
    env:
      # The tests swap Claude for a scripted fake or a mocked HTTP transport, and
      # RDAP/TLS lookups for fakes. CI gets no key, so it can never call the real API.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
